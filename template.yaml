AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Barback - bar inventory, par tracking, AI cocktail lab
Globals: 
  Function:
    Runtime: python3.14
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 256
    # X-Ray traces for every function
    Tracing: Active

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient
      CorsConfiguration:
        AllowOrigins:
          - http://localhost:5173
          - !Sub https://${SiteDistribution.DomainName}
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PUT, DELETE]

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/health/
      Handler: app.handler
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE
            
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: barback-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      Schema:
        - Name: barId
          AttributeDataType: String
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: barback-client
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH, ALLOW_ADMIN_USER_PASSWORD_AUTH]
      PreventUserExistenceErrors: ENABLED
      ReadAttributes: [email, email_verified, custom:barId]
      WriteAttributes: [email]
  
  OwnerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: owner

  StaffGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: staff    
  
  MeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/me/
      Handler: app.handler
      Events:
        Me:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me
            Method: GET
  
  BarbackTable: #name of this resource in your template
    Type: AWS::DynamoDB::Table #make a DynamoDB table
    Properties:
      BillingMode: PAY_PER_REQUEST #pay per read/write; $0 when idle
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/api/
      Handler: app.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref BarbackTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BarbackTable
      Events:
        ListItems:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /items
            Method: GET
        CreateItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /items
            Method: POST
        UpdateItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /items/{id}
            Method: PUT
        DeleteItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /items/{id}
            Method: DELETE
        ListCategories:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /categories
            Method: GET
        CreateCategory:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /categories
            Method: POST
        GetPantry:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /pantry
            Method: GET
        SavePantry:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /pantry
            Method: PUT

  OrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/orders/
      Handler: app.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref BarbackTable
          FROM_EMAIL: interiano88.julio@gmail.com
          TO_EMAIL: interiano88.julio+distributor@gmail.com
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BarbackTable
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*
      Events:
        SendOrder:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /orders/send
            Method: POST

  AiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/ai/ #the folder just unzipped
      Handler: app.handler
      Timeout: 29 #ai replies take seconds. your other functions get 10.29 is just under the api gateway's 30-second
      Environment:
        Variables:
          TABLE_NAME: !Ref BarbackTable
          MODEL_ID: us.anthropic.claude-haiku-4-5-20251001-v1:0 #inference profile
      Policies:
        - DynamoDBReadPolicy: #read only
            TableName: !Ref BarbackTable
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel #permission to call the model. bedrock's converse api use this permission
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0
                - arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
      Events:
        Lab:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /ai/lab
            Method: POST
  
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]

  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: barback-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            S3OriginConfig: { OriginAccessIdentity: '' }
            OriginAccessControlId: !GetAtt SiteOAC.Id
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}
Outputs:
  ApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient

  SiteBucketName:
    Value: !Ref SiteBucket
  SiteDistributionId:
    Value: !Ref SiteDistribution
  SiteUrl:
    Value: !Sub https://${SiteDistribution.DomainName}

